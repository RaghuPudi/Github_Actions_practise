name: Caching practise
on: 
  workflow_dispatch:
jobs:
  caching:
    name: demo-cache
    runs-on: ubuntu-latest
    steps:
      - name: Restore-cache
        id: demo-cache
        uses: actions/cache@v4
        with:
          path: demo-cache
          key: demo-cache-v1
      - name: Populate the cache directory
        if: steps.demo-cache.outputs.cache-hit != 'true'
        run: | 
          echo "Cache miss , Generating contents"
          mkdir -p "demo-cache"
          date > demo-cache/timestamp.txt
      - name: Save Cache
        if: steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: demo-cache
          key: demo-cache-v1

      - name: Verify Cache status
        run: |
          echo "cache-hit? -> ${{ steps.demo-cache.outputs.cache-hit }}
          cat demo-cache/timestamp.txt
          