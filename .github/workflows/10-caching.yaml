name: Caching 
on: 
  workflow_dispatch:
jobs:
  actions-cache:
    name: Demo cache
    runs-on: ubuntu-latest
    steps:
      - name: restore on first miss
        id: demo-cache
        uses: actions/cache@v4
        with:
          path: demo-cache
          key: demo-cache-v1
      - name: Populate cache directory
        if: steps.demo-cache.output.cache-hit != 'true'
        run: | 
          echo "Cache Miss - generating contents"
          mkdir -p demo-cache
          date > demo-cache/timestamp.txt

      - name: Save the cache
        if: steps.demo-cache.output.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: demo-cache
          key: demo-cache-v1
      - name: Verify the Cache hit 
        run: |
          echo "Cache Hit? -> ${{ steps.demo-cache.outout.cache-hit}}"
          cat demo-cache/timestamp.txt
          