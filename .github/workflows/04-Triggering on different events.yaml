name: Triggering on different events
on:
    push:
        branches:
            - "feature-branch/*"
    pull_request:
        types:
          - opened
          - synchronize
          - reopened
        paths:
          - "core-features/filters/*.md"
          - "!core-features/filters/*.txt"
    schedule:
          cron: "0 0 * * *"
    workflow_dispatch:

jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
          - run: |
              echo "GITHUB_EVENT_PAYLOAD"
              cat "$GITHUB_EVENT_PATH"