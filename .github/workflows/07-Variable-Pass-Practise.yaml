name: Practise to Pass Variables
on:
    push
jobs:
    producer:
        runs-on: ubuntu-latest
        outputs:
            foo: ${{ steps.generate-foo.outputs.foo }}
        steps:
          - name: Generate and export foo
            id: generate-foo
            run: |
              foo = bar
              
              echo "foo=${foo}" >> "$GITHUB_OUTPUT"
              echo "FOO=${foo}" >> "$GITHUB_ENV"
          - name: Inspect the variables
            run: |
              echo "foo = ${{ steps.generate-foo.outputs.foo }}"
              echo "FOO = $FOO"